    <style>
      /* Pre-hydration skeleton: matches the shell so first paint is never a blank page. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background: #fff;
        font-family: "Saira Condensed", Arial, sans-serif;
        z-index: 200;
      }
      #boot .bars {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 26px;
      }
      #boot .bars i {
        width: 3px;
        height: 100%;
        background: #000;
        border-radius: 2px;
        opacity: 0.15;
        animation: boot 1.1s ease-in-out infinite;
      }
      #boot .bars i:nth-child(2) { animation-delay: 0.12s }
      #boot .bars i:nth-child(3) { animation-delay: 0.24s }
      #boot .bars i:nth-child(4) { animation-delay: 0.36s }
      #boot .bars i:nth-child(5) { animation-delay: 0.48s }
      #boot span {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      @keyframes boot {
        0%, 100% { transform: scaleY(0.25); opacity: 0.15 }
        50% { transform: scaleY(1); opacity: 0.9 }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bars i { animation: none; opacity: 0.5 }
      }
    </style>
